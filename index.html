<!DOCTYPE html>
<html lang="en" dir="ltr" data-palette="nile-silt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Ezz — AI & Machine Learning Developer</title>
<meta name="description" content="Mohamed Ezz — AI & Machine Learning Developer. Portfolio of machine learning and full-stack web projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="pixel-landscape-canvas" aria-hidden="true"></canvas>

<div class="dock">
  <button id="langBtn" aria-label="Switch language">ع</button>
  <button id="themeBtn" aria-label="Toggle light / dark"></button>
  <div class="pal-wrap">
    <button id="palBtn" aria-label="Palette" aria-haspopup="listbox" aria-expanded="false"><span class="pal-dot"></span></button>
    <div class="pal-menu" id="palMenu" role="listbox"></div>
  </div>
</div>

<main class="stage">
  <div class="grid">
    <section class="ident">
      <div class="who">
        <div class="avatar" role="img" aria-label="Mohamed Ezz"></div>
        <div>
          <h1 data-t="name"></h1>
          <p class="sub"><span data-t="sub"></span> · <button id="moreBtn" data-t="more"></button></p>
        </div>
      </div>
      <p class="pitch" data-t="pitch"></p>
      <p class="pitch2" data-t="pitch2"></p>
      <div class="btns">
        <a class="btn primary" href="https://github.com/mohamedezzmnu" target="_blank" rel="noopener">GitHub ↗</a>
        <button class="btn" id="msgBtn" data-t="msg"></button>
        <button class="btn" id="copyBtn" data-t="copy"></button>
      </div>
      <div class="icons" id="icons"></div>
    </section>
    <section class="panel-col">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="panel" id="panel"></div>
    </section>
  </div>
</main>

<script src="landscape.js"></script>
<script src="app.js"></script>
</body>
</html>
